<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iris Botanical Species Classifier | Patience Korbla</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 900px; width: 100%; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { margin: 0 0 0.5rem; font-size: 1.9rem; color: var(--accent); }
    header p { margin: 0; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .card h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .presets { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .preset-btn {
      background: #0f172a;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .preset-btn:hover { background: var(--accent); color: #0f172a; }
    .control { margin-bottom: 1.1rem; }
    .control label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.35rem; }
    .control span { color: var(--accent); font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .submit-btn:hover { background: var(--accent-hover); color: #fff; }
    .result-box {
      background: #0f172a;
      border-left: 4px solid var(--success);
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
    }
    .result-species { font-size: 1.5rem; font-weight: 700; color: var(--success); }
    .bar-group { margin-bottom: 0.85rem; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 0.25rem; }
    .bar-bg { background: #0f172a; height: 10px; border-radius: 99px; overflow: hidden; }
    .bar-fill { background: var(--accent); height: 100%; transition: width 0.35s ease; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌺 Iris Botanical Species Classifier</h1>
      <p>Multi-Class Machine Learning Inference Portal | Deployed on Vercel</p>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Morphological Measurements (cm)</h2>
        <div class="presets">
          <button class="preset-btn" onclick="setPreset(5.1, 3.5, 1.4, 0.2)">Preset: Setosa</button>
          <button class="preset-btn" onclick="setPreset(6.0, 2.7, 4.5, 1.5)">Preset: Versicolor</button>
          <button class="preset-btn" onclick="setPreset(6.7, 3.1, 5.6, 2.4)">Preset: Virginica</button>
        </div>

        <div class="control">
          <label>Sepal Length <span id="sl_val">5.8 cm</span></label>
          <input type="range" id="sepal_length" min="4.0" max="8.0" step="0.1" value="5.8" oninput="updateVal('sepal_length', 'sl_val'); predictSpecies();" />
        </div>
        <div class="control">
          <label>Sepal Width <span id="sw_val">3.0 cm</span></label>
          <input type="range" id="sepal_width" min="2.0" max="4.5" step="0.1" value="3.0" oninput="updateVal('sepal_width', 'sw_val'); predictSpecies();" />
        </div>
        <div class="control">
          <label>Petal Length <span id="pl_val">4.3 cm</span></label>
          <input type="range" id="petal_length" min="1.0" max="7.0" step="0.1" value="4.3" oninput="updateVal('petal_length', 'pl_val'); predictSpecies();" />
        </div>
        <div class="control">
          <label>Petal Width <span id="pw_val">1.3 cm</span></label>
          <input type="range" id="petal_width" min="0.1" max="2.5" step="0.1" value="1.3" oninput="updateVal('petal_width', 'pw_val'); predictSpecies();" />
        </div>

        <button class="submit-btn" onclick="predictSpecies()">Classify Botanical Species</button>
      </div>

      <div class="card">
        <h2>Classification Output</h2>
        <div class="result-box">
          <div style="font-size:0.85rem; color:var(--muted);">Predicted Taxonomic Class</div>
          <div class="result-species" id="pred_species">Iris Versicolor</div>
          <div style="font-size:0.9rem; margin-top:0.25rem;" id="pred_conf">Confidence: 98.00%</div>
        </div>

        <h3 style="font-size:1rem; color:var(--muted); margin-bottom:0.75rem;">Class Probability Distribution</h3>
        <div id="prob_bars"></div>
      </div>
    </div>
  </div>

  <script>
    const TARGET_NAMES = ["Iris Setosa", "Iris Versicolor", "Iris Virginica"];
    const IRIS_DATA = [
      [5.1,3.5,1.4,0.2,0],[4.9,3.0,1.4,0.2,0],[4.7,3.2,1.3,0.2,0],[4.6,3.1,1.5,0.2,0],[5.0,3.6,1.4,0.2,0],
      [5.4,3.9,1.7,0.4,0],[4.6,3.4,1.4,0.3,0],[5.0,3.4,1.5,0.2,0],[4.4,2.9,1.4,0.2,0],[4.9,3.1,1.5,0.1,0],
      [5.4,3.7,1.5,0.2,0],[4.8,3.4,1.6,0.2,0],[4.8,3.0,1.4,0.1,0],[4.3,3.0,1.1,0.1,0],[5.8,4.0,1.2,0.2,0],
      [5.7,4.4,1.5,0.4,0],[5.4,3.9,1.3,0.4,0],[5.1,3.5,1.4,0.3,0],[5.7,3.8,1.7,0.3,0],[5.1,3.8,1.5,0.3,0],
      [5.4,3.4,1.7,0.2,0],[5.1,3.7,1.5,0.4,0],[4.6,3.6,1.0,0.2,0],[5.1,3.3,1.7,0.5,0],[4.8,3.4,1.9,0.2,0],
      [5.0,3.0,1.6,0.2,0],[5.0,3.4,1.6,0.4,0],[5.2,3.5,1.5,0.2,0],[5.2,3.4,1.4,0.2,0],[4.7,3.2,1.6,0.2,0],
      [4.8,3.1,1.6,0.2,0],[5.4,3.4,1.5,0.4,0],[5.2,4.1,1.5,0.1,0],[5.5,4.2,1.4,0.2,0],[4.9,3.1,1.5,0.2,0],
      [5.0,3.2,1.2,0.2,0],[5.5,3.5,1.3,0.2,0],[4.9,3.6,1.4,0.1,0],[4.4,3.0,1.3,0.2,0],[5.1,3.4,1.5,0.2,0],
      [5.0,3.5,1.3,0.3,0],[4.5,2.3,1.3,0.3,0],[4.4,3.2,1.3,0.2,0],[5.0,3.5,1.6,0.6,0],[5.1,3.8,1.9,0.4,0],
      [4.8,3.0,1.4,0.3,0],[5.1,3.8,1.6,0.2,0],[4.6,3.2,1.4,0.2,0],[5.3,3.7,1.5,0.2,0],[5.0,3.3,1.4,0.2,0],
      [7.0,3.2,4.7,1.4,1],[6.4,3.2,4.5,1.5,1],[6.9,3.1,4.9,1.5,1],[5.5,2.3,4.0,1.3,1],[6.5,2.8,4.6,1.5,1],
      [5.7,2.8,4.5,1.3,1],[6.3,3.3,4.7,1.6,1],[4.9,2.4,3.3,1.0,1],[6.6,2.9,4.6,1.3,1],[5.2,2.7,3.9,1.4,1],
      [5.0,2.0,3.5,1.0,1],[5.9,3.0,4.2,1.5,1],[6.0,2.2,4.0,1.0,1],[6.1,2.9,4.7,1.4,1],[5.6,2.9,3.6,1.3,1],
      [6.7,3.1,4.4,1.4,1],[5.6,3.0,4.5,1.5,1],[5.8,2.7,4.1,1.0,1],[6.2,2.2,4.5,1.5,1],[5.6,2.5,3.9,1.1,1],
      [5.9,3.2,4.8,1.8,1],[6.1,2.8,4.0,1.3,1],[6.3,2.5,4.9,1.5,1],[6.1,2.8,4.7,1.2,1],[6.4,2.9,4.3,1.3,1],
      [6.6,3.0,4.4,1.4,1],[6.8,2.8,4.8,1.4,1],[6.7,3.0,5.0,1.7,1],[6.0,2.9,4.5,1.5,1],[5.7,2.6,3.5,1.0,1],
      [5.5,2.4,3.8,1.1,1],[5.5,2.4,3.7,1.0,1],[5.8,2.7,3.9,1.2,1],[6.0,2.7,5.1,1.6,1],[5.4,3.0,4.5,1.5,1],
      [6.0,3.4,4.5,1.6,1],[6.7,3.1,4.7,1.5,1],[6.3,2.3,4.4,1.3,1],[5.6,3.0,4.1,1.3,1],[5.5,2.5,4.0,1.3,1],
      [5.5,2.6,4.4,1.2,1],[6.1,3.0,4.6,1.4,1],[5.8,2.6,4.0,1.2,1],[5.0,2.3,3.3,1.0,1],[5.6,2.7,4.2,1.3,1],
      [5.7,3.0,4.2,1.2,1],[5.7,2.9,4.2,1.3,1],[6.2,2.9,4.3,1.3,1],[5.1,2.5,3.0,1.1,1],[5.7,2.8,4.1,1.3,1],
      [6.3,3.3,6.0,2.5,2],[5.8,2.7,5.1,1.9,2],[7.1,3.0,5.9,2.1,2],[6.3,2.9,5.6,1.8,2],[6.5,3.0,5.8,2.2,2],
      [7.6,3.0,6.6,2.1,2],[4.9,2.5,4.5,1.7,2],[7.3,2.9,6.3,1.8,2],[6.7,2.5,5.8,1.8,2],[7.2,3.6,6.1,2.5,2],
      [6.5,3.2,5.1,2.0,2],[6.4,2.7,5.3,1.9,2],[6.8,3.0,5.5,2.1,2],[5.7,2.5,5.0,2.0,2],[5.8,2.8,5.1,2.4,2],
      [6.4,3.2,5.3,2.3,2],[6.5,3.0,5.5,1.8,2],[7.7,3.8,6.7,2.2,2],[7.7,2.6,6.9,2.3,2],[6.0,2.2,5.0,1.5,2],
      [6.9,3.2,5.7,2.3,2],[5.6,2.8,4.9,2.0,2],[7.7,2.8,6.7,2.0,2],[6.3,2.7,4.9,1.8,2],[6.7,3.3,5.7,2.1,2],
      [7.2,3.2,6.0,1.8,2],[6.2,2.8,4.8,1.8,2],[6.1,3.0,4.9,1.8,2],[6.4,2.8,5.6,2.1,2],[7.2,3.0,5.8,1.6,2],
      [7.4,2.8,6.1,1.9,2],[7.9,3.8,6.4,2.0,2],[6.4,2.8,5.6,2.2,2],[6.3,2.8,5.1,1.5,2],[6.1,2.6,5.6,1.4,2],
      [7.7,3.0,6.1,2.3,2],[6.3,3.4,5.6,2.4,2],[6.4,3.1,5.5,1.8,2],[6.0,3.0,4.8,1.8,2],[6.9,3.1,5.4,2.1,2],
      [6.7,3.1,5.6,2.4,2],[6.9,3.1,5.1,2.3,2],[5.8,2.7,5.1,1.9,2],[6.8,3.2,5.9,2.3,2],[6.7,3.3,5.7,2.5,2],
      [6.7,3.0,5.2,2.3,2],[6.3,2.5,5.0,1.9,2],[6.5,3.0,5.2,2.0,2],[6.2,3.4,5.4,2.3,2],[5.9,3.0,5.1,1.8,2]
    ];

    function updateVal(inputId, spanId) {
      document.getElementById(spanId).innerText = parseFloat(document.getElementById(inputId).value).toFixed(1) + " cm";
    }

    function setPreset(sl, sw, pl, pw) {
      document.getElementById("sepal_length").value = sl;
      document.getElementById("sepal_width").value = sw;
      document.getElementById("petal_length").value = pl;
      document.getElementById("petal_width").value = pw;
      updateVal("sepal_length", "sl_val");
      updateVal("sepal_width", "sw_val");
      updateVal("petal_length", "pl_val");
      updateVal("petal_width", "pw_val");
      predictSpecies();
    }

    function predictSpecies() {
      const sl = parseFloat(document.getElementById("sepal_length").value);
      const sw = parseFloat(document.getElementById("sepal_width").value);
      const pl = parseFloat(document.getElementById("petal_length").value);
      const pw = parseFloat(document.getElementById("petal_width").value);

      const distances = IRIS_DATA.map(r => ({
        dist: Math.hypot(sl - r[0], sw - r[1], pl - r[2], pw - r[3]),
        cls: r[4]
      })).sort((a, b) => a.dist - b.dist);

      const weights = [0, 0, 0];
      for (const n of distances.slice(0, 15)) {
        weights[n.cls] += 1 / (n.dist + 1e-6);
      }
      const total = weights.reduce((a, b) => a + b, 0);
      const probs = weights.map(w => (w / total) * 100);
      const predIdx = probs.indexOf(Math.max(...probs));

      document.getElementById("pred_species").innerText = TARGET_NAMES[predIdx];
      document.getElementById("pred_conf").innerText = `Confidence: ${probs[predIdx].toFixed(2)}%`;

      const container = document.getElementById("prob_bars");
      container.innerHTML = "";
      TARGET_NAMES.forEach((label, i) => {
        const pct = probs[i];
        container.innerHTML += `
          <div class="bar-group">
            <div class="bar-label"><span>${label}</span><span>${pct.toFixed(2)}%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
          </div>
        `;
      });
    }

    window.onload = predictSpecies;
  </script>
</body>
</html>
